<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Islamabad Schools Navigation — Capital Region</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0f766e;
    --primary-dark: #0d5c56;
    --primary-light: #ccfbf1;
    --primary-accent: #14b8a6;
    --bg-main: #f1f5f9;
    --card-bg: #ffffff;
    --text-dark: #0f172a;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(15, 118, 110, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Plus Jakarta Sans', Segoe UI, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background-color: var(--bg-main);
    color: var(--text-dark);
  }

  /* Professional Header */
  header {
    background: linear-gradient(135deg, #0f766e 0%, #042f2e 100%);
    color: #ffffff;
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    z-index: 1000;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .header-icon {
    width: 42px;
    height: 42px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(8px);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
  }

  .header-title h1 {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #ffffff;
  }

  .header-title p {
    font-size: 0.78rem;
    color: #99f6e4;
    font-weight: 500;
  }

  /* Grid Layout */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 310px 1fr 310px;
    grid-template-rows: minmax(0, 1fr);
    min-height: 0;
  }

  aside {
    background: var(--card-bg);
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  aside::-webkit-scrollbar { width: 6px; }
  aside::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

  #left { border-right: 1px solid var(--border-color); }
  #right { border-left: 1px solid var(--border-color); }

  .section-title {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Restaurant Cards */
  #list { display: flex; flex-direction: column; gap: 8px; }

  .loc {
    padding: 14px;
    background: #f8fafc;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .loc:hover {
    background: #f0fdfa;
    border-color: var(--primary-accent);
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
  }

  .loc.active {
    background: linear-gradient(135deg, #f0fdfa 0%, #ccfbf1 100%);
    border-color: var(--primary);
    box-shadow: var(--shadow-md);
  }

  .loc b {
    display: block;
    font-size: 0.95rem;
    color: var(--text-dark);
    font-weight: 600;
    margin-bottom: 2px;
  }

  .loc small {
    display: block;
    color: var(--text-muted);
    font-size: 0.8rem;
  }

  /* Dedicated Distance & Time Summary Block (Left Side) */
  .travel-summary-card {
    background: linear-gradient(135deg, #0f766e 0%, #0d5c56 100%);
    color: white;
    padding: 16px;
    border-radius: 14px;
    box-shadow: 0 4px 12px rgba(15, 118, 110, 0.2);
    margin-top: auto;
  }

  .travel-summary-card .summary-title {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #99f6e4;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .metric-box {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(6px);
    padding: 10px;
    border-radius: 10px;
    text-align: center;
  }

  .metric-label {
    font-size: 0.7rem;
    color: #ccfbf1;
    margin-bottom: 2px;
  }

  .metric-value {
    font-size: 1.15rem;
    font-weight: 800;
    color: #ffffff;
  }

  #info {
    padding: 14px;
    background: #f0fdfa;
    border: 1px solid #99f6e4;
    border-radius: 12px;
    font-size: 0.82rem;
    line-height: 1.5;
    color: #0f766e;
  }

  /* Profile Card with Face Zoom Styling */
  .profile-card {
    text-align: center;
    padding: 18px 12px;
    background: linear-gradient(180deg, #f0fdfa 0%, #ffffff 100%);
    border-radius: 16px;
    border: 1px solid #ccfbf1;
    box-shadow: var(--shadow-sm);
  }

  .avatar-container {
    position: relative;
    width: 96px;
    height: 96px;
    margin: 0 auto 12px;
  }

  /* Zoomed Avatar Photo Styling */
  .avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    object-position: top center;
    transform: scale(1.18);
    border: 3px solid #14b8a6;
    box-shadow: 0 4px 14px rgba(20, 184, 166, 0.35);
  }

  .status-badge {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 14px;
    height: 14px;
    background: #10b981;
    border: 2px solid white;
    border-radius: 50%;
    z-index: 2;
  }

  .profile-name {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 2px;
  }

  .profile-role {
    font-size: 0.78rem;
    color: var(--primary);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* Student Info Block */
  .info-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .info-item {
    padding: 10px 12px;
    background: #f8fafc;
    border-radius: 10px;
    border: 1px solid var(--border-color);
  }

  .info-label {
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .info-value {
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text-dark);
  }

  /* Map Container */
  #map {
    height: 100%;
    width: 100%;
    min-height: 400px;
    z-index: 1;
  }

  @media(max-width: 900px) {
    main {
      grid-template-columns: 1fr;
      grid-template-rows: auto 50vh auto;
    }
    #left, #right { border: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="header-icon">🏫</div>
    <div class="header-title">
      <h1>Islamabad Schools Navigation</h1>
      <p>Capital Region Interactive Dashboard</p>
    </div>
  </div>
</header>

<main>
  <!-- Left Column: Locations, Travel Stats & Info -->
  <aside id="left">
    <div class="section-title"><span>🏫</span> Featured Schools</div>
    <div id="list"></div>

    <!-- Moved Travel Metrics Card to Left Sidebar -->
    <div class="travel-summary-card">
      <div class="summary-title">🚗 Travel Metrics</div>
      <div class="metrics-grid">
        <div class="metric-box">
          <div class="metric-label">Distance</div>
          <div class="metric-value" id="val-distance">-- km</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">Est. Time</div>
          <div class="metric-value" id="val-time">-- min</div>
        </div>
      </div>
    </div>

    <div id="info">Select a school to calculate the route.</div>
  </aside>

  <!-- Middle Column: Map -->
  <div id="map"></div>

  <!-- Right Column: Student Profile -->
  <aside id="right">
    <div class="section-title"><span>👤</span> User Profile</div>
    
    <div class="profile-card">
      <div class="avatar-container">
        <img src="photo.jpg" alt="Ahmad Hassan" class="avatar-img" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 96 96%27%3E%3Crect width=%2796%27 height=%2796%27 fill=%27%23ccfbf1%27/%3E%3Ctext x=%2748%27 y=%2766%27 font-size=%2750%27 text-anchor=%27middle%27%3E👤%3C/text%3E%3C/svg%3E'">
        <div class="status-badge"></div>
      </div>
      <div class="profile-name">Ahmad Hassan</div>
      <div class="profile-role">Student Navigator</div>
    </div>

    <div class="info-group">
      <div class="info-item">
        <div class="info-label">ARID Number</div>
        <div class="info-value">24-ARID-2197</div>
      </div>
      <div class="info-item">
        <div class="info-label">City</div>
        <div class="info-value">Islamabad, Pakistan</div>
      </div>
      <div class="info-item">
        <div class="info-label">Category</div>
        <div class="info-value">Schools</div>
      </div>
    </div>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const places = [
  {name:"Islamabad College for Boys", area:"G-6/3, Islamabad", lat:33.7131, lng:73.0786},
  {name:"Islamabad College for Girls", area:"F-7/2, Islamabad", lat:33.7229, lng:73.0560},
  {name:"Froebel's International School", area:"F-8, Islamabad", lat:33.7120, lng:73.0380},
  {name:"The City School, Capital Campus", area:"F-7, Islamabad", lat:33.7235, lng:73.0500}
];

const map = L.map('map').setView([33.7215, 73.0433], 12);
const providers = [
 {url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',o:{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}},
 {url:'https://tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',o:{maxZoom:19,attribution:'&copy; OpenStreetMap contributors, HOT'}},
 {url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',o:{maxZoom:19,attribution:'Tiles &copy; Esri'}}
];

let pi = (location.protocol==='file:') ? 2 : 0, errs = 0, baseLayer = null;
function loadBase(){
  if(baseLayer) map.removeLayer(baseLayer);
  baseLayer = L.tileLayer(providers[pi].url, providers[pi].o).addTo(map);
  errs = 0;
  baseLayer.on('tileerror', ()=>{ if(++errs >= 4 && pi < providers.length-1){ pi++; loadBase(); } });
}
loadBase();

let userLatLng = null, userMarker = null, destMarker = null, routeLine = null;
const info = document.getElementById('info');
const valDistance = document.getElementById('val-distance');
const valTime = document.getElementById('val-time');

function locateUser(){
  if(!navigator.geolocation){ useFallback("Geolocation not supported."); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    setUser(pos.coords.latitude, pos.coords.longitude, "You are here");
  }, err=>useFallback("Location denied/unavailable - using Faisal Mosque as demo start."),
  {enableHighAccuracy:true, timeout:10000});
}

function useFallback(msg){ 
  setUser(33.7295, 73.0372, "Demo start (Faisal Mosque)"); 
  info.textContent = msg; 
}

function setUser(lat, lng, label){
  userLatLng = [lat, lng];
  if(userMarker) map.removeLayer(userMarker);
  userMarker = L.circleMarker(userLatLng, {
    radius: 9,
    color: '#ffffff',
    weight: 3,
    fillColor: '#0f766e',
    fillOpacity: 1
  }).addTo(map).bindPopup(label);
}

const list = document.getElementById('list');
places.forEach((p, i)=>{
  const d = document.createElement('div');
  d.className = 'loc'; 
  d.innerHTML = `<b>${p.name}</b><small>${p.area}</small>`;
  d.onclick = () => selectPlace(i, d);
  list.appendChild(d);
});

async function selectPlace(i, el){
  document.querySelectorAll('.loc').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  const p = places[i];
  
  if(destMarker) map.removeLayer(destMarker);
  if(routeLine) map.removeLayer(routeLine);
  
  destMarker = L.marker([p.lat, p.lng]).addTo(map).bindPopup(`<b>${p.name}</b><br>${p.area}`).openPopup();
  
  if(!userLatLng){ 
    info.textContent = "Detecting your location..."; 
    locateUser(); 
    await new Promise(r => setTimeout(r, 1500)); 
  }
  
  if(!userLatLng){ 
    map.setView([p.lat, p.lng], 15); 
    return; 
  }
  
  info.textContent = "Calculating route...";
  
  const url = `https://router.project-osrm.org/route/v1/driving/${userLatLng[1]},${userLatLng[0]};${p.lng},${p.lat}?overview=full&geometries=geojson`;
  try {
    const r = await (await fetch(url)).json();
    if(r.code !== "Ok") throw new Error(r.code);
    const rt = r.routes[0];
    
    routeLine = L.geoJSON(rt.geometry, {style: {color: '#0f766e', weight: 5, opacity: 0.85}}).addTo(map);
    map.fitBounds(routeLine.getBounds(), {padding: [50, 50]});
    
    const km = (rt.distance / 1000).toFixed(2);
    const min = Math.round(rt.duration / 60);
    
    valDistance.textContent = `${km} km`;
    valTime.textContent = `${min} min`;
    info.innerHTML = `Selected: <b>${p.name}</b><br>Route calculation complete.`;
  } catch(e) {
    info.textContent = "Route error: " + e.message;
    valDistance.textContent = "-- km";
    valTime.textContent = "-- min";
  }
}

locateUser();
</script>
</body>
</html>
